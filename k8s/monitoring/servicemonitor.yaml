apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ecommerce-backend-monitor
  namespace: monitoring
  labels:
    app: ecommerce-backend
spec:
  selector:
    matchLabels:
      app: ecommerce-backend
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
  namespaceSelector:
    matchNames:
    - default
